<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speech Rhythm — Timing Review &amp; Live Flow Guide</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 antialiased p-4 md:p-6 space-y-4">

  <!-- ===================================================================== -->
  <!-- COMPACT TOP BAR: 2 SEPARATE TABS + PHRASE DROPDOWN                    -->
  <!-- ===================================================================== -->
  <div class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 flex flex-wrap items-center justify-between gap-3">
    <!-- 2 Separate Tabs (Never Display Both Together) -->
    <div class="flex items-center gap-1.5 bg-slate-950 p-1 rounded-lg border border-slate-800">
      <button id="main-tab-post" onclick="AppController.setMainView('post')" class="px-4 py-1.5 rounded-md text-xs font-bold transition-all bg-indigo-600 text-white shadow-sm">
        Timing Review
      </button>
      <button id="main-tab-live" onclick="AppController.setMainView('live')" class="px-4 py-1.5 rounded-md text-xs font-bold transition-all text-slate-400 hover:text-white">
        Live Flow Guide
      </button>
    </div>

    <!-- Phrase Dropdown & Tempo -->
    <div class="flex flex-wrap items-center gap-3">
      <label class="flex items-center gap-2 text-xs font-semibold text-slate-300">
        <span>Phrase:</span>
        <select id="phrase-select" onchange="AppController.selectPhrase(Number(this.value))" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs font-semibold text-slate-100">
        </select>
      </label>

      <label class="flex items-center gap-2 text-xs text-slate-400">
        <span>Tempo:</span>
        <input id="global-bpm-slider" type="range" min="72" max="112" value="88" oninput="AppController.setBPM(this.value)" class="w-20 accent-indigo-500 cursor-pointer" />
        <span id="global-bpm-val" class="font-mono font-bold text-indigo-400">88</span>
      </label>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- TAB 1: TIMING REVIEW (VocAlign Elastic Tethers)                       -->
  <!-- ===================================================================== -->
  <div id="section-goal1" class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div class="flex flex-wrap items-center gap-2">
        <label class="text-xs font-bold text-slate-300" for="goal1-profile-select">Learner Take:</label>
        <select id="goal1-profile-select" onchange="AppController.setGoal1Profile(this.value)" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs font-semibold text-slate-100">
          <option value="dysfluent_hesitation">1. Hesitation Pause (+450ms) &amp; Stretched Function Word</option>
          <option value="dysfluent_stutter">2. Initial Stutter Repetition ([p-][p-]) &amp; Late Vowel</option>
          <option value="syllable_timed_choppy">3. Choppy Word-by-Word (Unreduced Schwas)</option>
          <option value="cluttered_runon">4. Rushed Run-On (Skipped Pause + Clipped Vowel)</option>
          <option value="native_expressive">5. Fluent Expressive Speaker</option>
          <option value="live_recorded">6. Captured Run from Live Flow Guide</option>
        </select>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <button onclick="window.Goal1PostDiagnostics.auditionNative()" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-sky-500/20 hover:bg-sky-500/30 text-sky-200 border border-sky-400/40 transition">
          🔊 Play Reference
        </button>
        <button onclick="window.Goal1PostDiagnostics.auditionLearner()" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-rose-500/25 hover:bg-rose-500/35 text-rose-200 border border-rose-400/50 transition">
          🔊 Play Learner Take
        </button>
        <button onclick="window.Goal1PostDiagnostics.stopAudition()" class="px-2.5 py-1.5 rounded-lg text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition">
          ■ Stop
        </button>
      </div>
    </div>

    <!-- Clean VocAlign Elastic Tether SVG Stage -->
    <div class="rounded-xl border border-slate-800 bg-slate-950 overflow-x-auto shadow-inner p-2">
      <svg id="goal1-svg" class="w-full block" style="min-width: 780px; height: 340px;" viewBox="0 0 960 340"></svg>
    </div>

    <!-- Collapsible Teacher Notes & Coaching Details -->
    <details class="bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-300">
      <summary class="cursor-pointer font-bold text-slate-200 select-none">
        Teacher Notes &amp; Coaching Diagnostics
      </summary>
      <div class="mt-3 space-y-3 pt-3 border-t border-slate-800">
        <p id="phrase-focus-label" class="text-slate-400"></p>
        <div id="goal1-coaching" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
      </div>
    </details>
  </div>

  <!-- ===================================================================== -->
  <!-- TAB 2: LIVE FLOW GUIDE (Prosodic Flow Matrix)                         -->
  <!-- ===================================================================== -->
  <div id="section-goal2" class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3 hidden">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <button id="btn-play-loop" onclick="AppController.toggleLoop()" class="px-3.5 py-1.5 rounded-lg text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white shadow transition flex items-center gap-1.5">
          <span id="loop-btn-icon">▶</span>
          <span id="loop-btn-text">Start 2-Bar Loop</span>
        </button>
      </div>

      <button onclick="AppController.inspectLiveInGoal1()" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 border border-indigo-500/40 transition">
        Review in Timing Review &rarr;
      </button>
    </div>

    <!-- Mount Container for Prosodic Flow Matrix -->
    <div id="goal2-mount"></div>
  </div>

  <!-- Load Modular Suite Scripts -->
  <script src="./js/data_and_audio.js?v=4"></script>
  <script src="./js/goal2_live_modes.js?v=4"></script>
  <script src="./js/goal1_post_modes.js?v=4"></script>

  <script>
    const AppController = {
      mainView: 'post',
      phraseIdx: 0,
      goal1Profile: 'dysfluent_hesitation',

      init() {
        const core = window.SpeechRhythmCore;
        this.renderPhraseSelect();

        if (window.Goal2LiveTrainer) {
          window.Goal2LiveTrainer.init('#goal2-mount', {
            mode: 'flow_matrix',
            phrase: core.PHRASES[this.phraseIdx],
            bpm: core.audioEngine ? core.audioEngine.bpm : 88
          });
        }

        this.refreshGoal1();
      },

      renderPhraseSelect() {
        const core = window.SpeechRhythmCore;
        const select = document.getElementById('phrase-select');
        const phrases = core.PHRASES;
        select.innerHTML = phrases
          .map((p, idx) => `<option value="${idx}" ${idx === this.phraseIdx ? 'selected' : ''}>${idx + 1}. "${p.title}"</option>`)
          .join('');
        const cur = phrases[this.phraseIdx];
        const focusEl = document.getElementById('phrase-focus-label');
        if (focusEl) {
          focusEl.textContent = cur ? (cur.pedagogicalFocus || cur.focus || '') : '';
        }
      },

      selectPhrase(idx) {
        const core = window.SpeechRhythmCore;
        this.phraseIdx = idx;
        core.currentPhraseIndex = idx;
        const phrase = core.PHRASES[idx];
        this.renderPhraseSelect();

        if (core.audioEngine) {
          core.audioEngine.setPhrase(phrase);
        }
        if (window.Goal2LiveTrainer) {
          window.Goal2LiveTrainer.setPhrase(phrase);
        }
        this.refreshGoal1();
      },

      setMainView(view) {
        this.mainView = view === 'live' ? 'live' : 'post';
        const sec1 = document.getElementById('section-goal1');
        const sec2 = document.getElementById('section-goal2');
        const tabPost = document.getElementById('main-tab-post');
        const tabLive = document.getElementById('main-tab-live');

        const activeCls = 'px-4 py-1.5 rounded-md text-xs font-bold transition-all bg-indigo-600 text-white shadow-sm';
        const inactiveCls = 'px-4 py-1.5 rounded-md text-xs font-bold transition-all text-slate-400 hover:text-white';

        tabPost.className = this.mainView === 'post' ? activeCls : inactiveCls;
        tabLive.className = this.mainView === 'live' ? activeCls : inactiveCls;

        if (this.mainView === 'post') {
          sec1.classList.remove('hidden');
          sec2.classList.add('hidden');
          if (window.Goal2LiveTrainer && window.Goal2LiveTrainer.isPlaying) {
            this.toggleLoop();
          }
          this.refreshGoal1();
        } else {
          sec1.classList.add('hidden');
          sec2.classList.remove('hidden');
          if (window.Goal1PostDiagnostics) {
            window.Goal1PostDiagnostics.stopAudition();
          }
          if (window.Goal2LiveTrainer) {
            window.Goal2LiveTrainer.renderFrame(window.Goal2LiveTrainer.currentBeat || 0, true);
          }
        }
      },

      setBPM(val) {
        const bpm = Number(val) || 88;
        document.getElementById('global-bpm-val').textContent = bpm;
        const core = window.SpeechRhythmCore;
        if (core && core.audioEngine) {
          core.audioEngine.setBPM(bpm);
        }
        if (window.Goal2LiveTrainer) {
          window.Goal2LiveTrainer.bpm = bpm;
        }
      },

      toggleLoop() {
        if (!window.Goal2LiveTrainer) return;
        const btnText = document.getElementById('loop-btn-text');
        const btnIcon = document.getElementById('loop-btn-icon');
        const btn = document.getElementById('btn-play-loop');

        if (window.Goal2LiveTrainer.isPlaying) {
          window.Goal2LiveTrainer.stopLoop();
          btnText.textContent = 'Start 2-Bar Loop';
          btnIcon.textContent = '▶';
          btn.className = 'px-3.5 py-1.5 rounded-lg text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white shadow transition flex items-center gap-1.5';
        } else {
          window.Goal2LiveTrainer.startLoop();
          btnText.textContent = 'Stop 2-Bar Loop';
          btnIcon.textContent = '■';
          btn.className = 'px-3.5 py-1.5 rounded-lg text-xs font-bold bg-rose-600 hover:bg-rose-500 text-white shadow transition flex items-center gap-1.5';
        }
      },

      setGoal1Profile(profileKey) {
        this.goal1Profile = profileKey;
        const sel = document.getElementById('goal1-profile-select');
        if (sel && sel.value !== profileKey) sel.value = profileKey;
        this.refreshGoal1();
      },

      inspectLiveInGoal1() {
        const perf = window.Goal2LiveTrainer ? window.Goal2LiveTrainer.getPerformer() : 'bot_dysfluent';
        if (perf === 'bot_native') {
          this.goal1Profile = 'native_expressive';
        } else if (perf === 'bot_choppy') {
          this.goal1Profile = 'syllable_timed_choppy';
        } else if (perf === 'bot_dysfluent') {
          this.goal1Profile = 'dysfluent_hesitation';
        } else {
          this.goal1Profile = 'live_recorded';
        }
        const sel = document.getElementById('goal1-profile-select');
        if (sel) sel.value = this.goal1Profile;
        this.setMainView('post');
      },

      refreshGoal1() {
        const core = window.SpeechRhythmCore;
        const phrase = core.PHRASES[this.phraseIdx];
        const learnerSyls = core.generateLearnerSyllables(phrase, this.goal1Profile, true);

        if (window.Goal1PostDiagnostics) {
          window.Goal1PostDiagnostics.render('goal1-svg', {
            mode: 'vocalign_tether',
            phrase,
            learnerSyllables: learnerSyls,
            normFactor: 1.0,
            profileKey: this.goal1Profile,
            coachingContainer: 'goal1-coaching'
          });
        }
      }
    };

    window.AppController = AppController;
    window.addEventListener('DOMContentLoaded', () => AppController.init());
  </script>
</body>
</html>
