<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Speech Guider</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #172554; font: 1rem/1.6 system-ui, sans-serif; }
    main { max-width: 36rem; margin: 1rem; padding: 2rem; border: 1px solid #cbd5e1; border-radius: .9rem; background: white; }
    h1 { margin: 0; line-height: 1.2; }
    p { margin: 1rem 0 0; }
    code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main aria-live="polite">
    <h1>Speech Guider</h1>
    <p id="status" role="status">Starting the local backend…</p>
    <p id="help" hidden>Quit Speech Guider and reopen it to try again.</p>
    <p id="log" hidden>Backend log: <code id="log-path"></code></p>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    if (error) {
      document.getElementById('status').textContent = error;
      document.getElementById('help').hidden = false;
    }
    const log = params.get('log');
    if (log) {
      document.getElementById('log-path').textContent = log;
      document.getElementById('log').hidden = false;
    }
  </script>
</body>
</html>
